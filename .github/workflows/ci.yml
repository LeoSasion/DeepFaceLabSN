name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webui-linux:
    name: Linux WebUI verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install fixture Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          test "$(pnpm --version)" = "11.19.0"

      - name: Install WebUI dependencies
        shell: bash
        run: pnpm --dir webui install --frozen-lockfile

      - name: Install deterministic DFL fixture dependencies
        shell: bash
        run: |
          python -m venv webui/.runtime/test-python
          webui/.runtime/test-python/bin/python -m pip install --disable-pip-version-check -r webui/tests/requirements.txt
          echo "DFLSN_TEST_PYTHON=$GITHUB_WORKSPACE/webui/.runtime/test-python/bin/python" >> "$GITHUB_ENV"

      - name: Verify versions, translations, and update signatures
        shell: bash
        run: |
          node tools/verify-version.mjs
          node tools/check-i18n.mjs
          node tools/update-channel-signature.mjs verify-policy
          node --test tools/tests/update-channel-signature.test.mjs

      - name: Run hermetic WebUI tests
        shell: bash
        run: pnpm --dir webui test

      - name: Build and smoke-test WebUI artifacts
        shell: bash
        run: |
          pnpm --dir webui run build
          pnpm --dir webui run test:sites
          node tools/dist-provenance.mjs check
          node tools/smoke-dist.mjs

  verify-release:
    name: Windows release verification
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install fixture Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm --version

      - name: Install WebUI dependencies
        shell: pwsh
        working-directory: webui
        run: pnpm install --frozen-lockfile

      - name: Install deterministic DFL fixture dependencies
        shell: pwsh
        run: |
          python -m venv webui/.runtime/test-python
          if ($LASTEXITCODE -ne 0) { throw "Test Python creation failed." }
          & webui/.runtime/test-python/Scripts/python.exe -m pip install --disable-pip-version-check -r webui/tests/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Test dependencies failed to install." }
          "DFLSN_TEST_PYTHON=$env:GITHUB_WORKSPACE\webui\.runtime\test-python\Scripts\python.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Windows PowerShell test runner
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools\prepare-launcher-tests.ps1

      - name: Prepare launcher build fixtures
        shell: pwsh
        run: |
          npm --prefix launcher/ui ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Launcher UI dependency install failed." }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File launcher\build-host.ps1
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed." }

      - name: Run release gates
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools\verify-release.ps1

      - name: Upload verified WebUI build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist-${{ github.sha }}
          path: webui/dist
          if-no-files-found: error
          retention-days: 7
